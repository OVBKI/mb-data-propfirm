[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# Note : startCommand is intentionally NOT set here.
# We let Railway use the CMD from the Dockerfile, which properly wraps the
# command in `sh -c "..."` so that ${PORT} env var substitution works.
# If we set startCommand here without sh -c, Railway passes "$PORT" as a literal
# string to uvicorn and the container fails to start.

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 60
